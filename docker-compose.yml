services:
  pdf-studio:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PDF_STORAGE_DIR: /data
      PDF_DATABASE_PATH: /data/history.sqlite3
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000}
    volumes:
      - pdf-studio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  pdf-studio-data:
